name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# اگر پشت‌سرهم push کردی، اجرای قدیمی لغو می‌شه
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit and component tests
        run: npm test

      - name: Database tests (PGlite, no external database needed)
        run: npm run test:db

      # مقدارهای زیر فقط ساختگی‌اند تا build بدون Supabase واقعی انجام بشه
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key